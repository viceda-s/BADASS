version: 2

updates:
  # Keep the actions used by the CI workflows current. Pinned action versions
  # go stale quietly, and a stale action is the usual cause of a workflow that
  # starts failing for reasons unrelated to the change under review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - ci
